[workspace]
resolver = "2"
members = [
    "crates/rekey-core",
    "crates/rekey-hook",
    "crates/rekey-ai",
    "app/src-tauri",
    "tools/modelgen",
    "tools/eval",
]

[workspace.package]
version = "0.3.1"
edition = "2021"
rust-version = "1.77"
license = "MIT"
repository = "https://github.com/Marmos1337/MarKey"
homepage = "https://github.com/Marmos1337/MarKey"
# MarKey is a fork of Rekey (https://github.com/rstqDev/rekey, MIT).
authors = ["marmos", "Rostislav Ladnov (Rekey)"]

[workspace.dependencies]
rekey-core = { path = "crates/rekey-core" }
rekey-hook = { path = "crates/rekey-hook" }
rekey-ai = { path = "crates/rekey-ai" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
