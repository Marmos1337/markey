[package]
name = "rekey-app"
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true
homepage.workspace = true
description = "MarKey — fixes text typed on the wrong keyboard layout. Based on Rekey."
default-run = "markey"

[[bin]]
name = "markey"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rekey-core = { workspace = true }
rekey-hook = { workspace = true }
rekey-ai = { workspace = true }
# macos-private-api is what allows a transparent window, which is in turn what
# lets the system's vibrancy material show behind the content. It rules out the
# Mac App Store — which Rekey cannot ship to anyway, since App Store sandboxing
# forbids the keyboard access the whole app depends on.
tauri = { version = "=2.11.6", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
# A second copy would install a second keyboard hook and correct every word
# twice; launching again just opens the settings of the one already running.
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
# Only the filter syntax (MARKEY_LOG / RUST_LOG); writing is our own, off the
# keyboard thread (src/logging.rs).
env_filter = "2"
dirs = "6"
# Update check and download (updater.rs); the same HTTP client as rekey-ai.
ureq = { version = "3", features = ["json"] }
sha2 = "0.10"

# The API key lives in the Keychain (Security.framework, through Core
# Foundation types) or the Windows Credential Manager; see src/secrets.rs.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[features]
# Tauri's default production behaviour; kept explicit for the release build.
custom-protocol = ["tauri/custom-protocol"]
